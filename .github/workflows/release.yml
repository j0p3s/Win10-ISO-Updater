name: release

# Actions -> release -> Run workflow (on main). Checks that the version is the one in the code and has
# a CHANGELOG entry, runs the tests, then creates the tag and the GitHub release with that CHANGELOG
# entry as notes and Win10-ISO-Updater.cmd (+ its SHA-256) attached.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 3.0.0 (must match $Script:AppVersion and a "## vX.Y.Z" CHANGELOG entry)'
        required: true
      title:
        description: 'Release title after "vX.Y.Z - " (optional)'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version, changelog and tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::Run the release from main (this run is on $GITHUB_REF)"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must look like 3.0.0, not '$VERSION'"; exit 1; }
          grep -q "^\$Script:AppVersion   = '$VERSION'" src/10_engine_head.ps1 || { echo "::error::src/10_engine_head.ps1 is not version $VERSION"; exit 1; }
          grep -q "Starting Win10 ISO Updater v$VERSION " src/00_header.cmd || { echo "::error::src/00_header.cmd is not version $VERSION"; exit 1; }
          grep -q "^## v$VERSION " CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## v$VERSION' entry"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then echo "::error::Tag v$VERSION already exists"; exit 1; fi

      - name: Win10-ISO-Updater.cmd matches src/
        run: |
          python3 src/build.py
          git diff --exit-code -- Win10-ISO-Updater.cmd || { echo "::error::Win10-ISO-Updater.cmd is not the build of src/ - run python src/build.py and commit it"; exit 1; }

      - name: Test suites
        shell: pwsh
        run: ./tests/run-tests.ps1

      - name: Create the release
        env:
          VERSION: ${{ inputs.version }}
          TITLE: ${{ inputs.title }}
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v head="## v$VERSION " 'index($0, head) == 1 { on = 1; next } on && /^## v/ { exit } on { print }' CHANGELOG.md > notes.md
          prev=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -n "$prev" ]; then printf '\n**Full Changelog**: https://github.com/%s/compare/%s...v%s\n' "$GITHUB_REPOSITORY" "$prev" "$VERSION" >> notes.md; fi
          sha256sum Win10-ISO-Updater.cmd > Win10-ISO-Updater.cmd.sha256
          name="v$VERSION"
          if [ -n "$TITLE" ]; then name="v$VERSION — $TITLE"; fi
          gh release create "v$VERSION" Win10-ISO-Updater.cmd Win10-ISO-Updater.cmd.sha256 \
            --target "$GITHUB_SHA" --title "$name" --notes-file notes.md --latest
