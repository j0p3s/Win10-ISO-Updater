name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Windows-ISO-updater-GUI_vX.X.X.cmd matches src/
        run: |
          python3 src/build.py
          # the build writes Windows-ISO-updater-GUI_v<AppVersion>.cmd and removes older ones: any change, new or deleted file is a mismatch
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::The .cmd in the repo is not the build of src/ - run python src/build.py and commit the result (new Windows-ISO-updater-GUI_v*.cmd, old one removed)"
            exit 1
          fi

      - name: Test suites
        shell: pwsh
        run: ./tests/run-tests.ps1
