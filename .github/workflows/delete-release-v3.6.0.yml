name: delete release v3.6.0 (one-off)

# Temporary: runs once on a push to this working branch, deletes the v3.6.0 release (published by
# mistake before the same changes became 4.0.0). The tag is kept. This file is removed right after.
on:
  push:
    branches: [ccr-0ebf53e0-gw0121]

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the v3.6.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v3.6.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete v3.6.0 --repo "$GITHUB_REPOSITORY" --yes
            echo "release v3.6.0 deleted"
          else
            echo "no release v3.6.0"
          fi
